<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIT Mostar — Kvizovi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F4EE;
    --card: #FFFFFF;
    --primary: #1A3A5C;
    --accent: #D4631A;
    --correct: #1B6E4F;
    --correct-bg: #EAF5EF;
    --wrong: #B52B2B;
    --wrong-bg: #FAEAEA;
    --text: #1A1A1A;
    --muted: #7A7060;
    --border: #E0D9CD;
    --selected: #1A3A5C;
    --selected-bg: #EEF3FA;
    --shadow: 0 2px 16px rgba(26,58,92,0.09);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .page {
    max-width: 680px;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 4rem;
  }

  /* ── LANDING PAGE (START SCREEN) ── */
  .landing-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 75vh;
    text-align: center;
  }

  .landing-title {
    font-family: 'DM Serif Display', serif;
    font-size: 38px;
    color: var(--primary);
    margin-bottom: 0.5rem;
  }

  .landing-subtitle {
    font-size: 15px;
    color: var(--muted);
    margin-bottom: 3rem;
  }

  .boxes-grid {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 600px;
  }

  .start-box {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 16px;
    width: 260px;
    height: 220px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .start-box:hover {
    transform: translateY(-5px);
    border-color: var(--primary);
    box-shadow: 0 8px 24px rgba(26,58,92,0.15);
  }

  .start-box .icon-wrap {
    width: 56px;
    height: 56px;
    border-radius: 12px;
    background: var(--selected-bg);
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin-bottom: 1rem;
    font-weight: bold;
  }

  .start-box h3 {
    font-size: 16.5px;
    font-weight: 600;
    color: var(--primary);
    margin-bottom: 6px;
    line-height: 1.3;
  }

  .start-box p {
    font-size: 13px;
    color: var(--muted);
  }

  /* ── HEADER ── */
  .quiz-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.75rem;
  }
  .quiz-header .q-counter {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
  }
  .mode-badge {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 20px;
    background: var(--primary);
    color: #fff;
    white-space: nowrap;
  }
  .mode-badge.retake { background: var(--accent); }

  /* ── PROGRESS ── */
  .progress-bar-wrap { margin-bottom: 1.75rem; }
  .progress-track {
    height: 5px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--primary);
    border-radius: 3px;
    transition: width 0.45s cubic-bezier(.4,0,.2,1);
  }

  /* ── QUESTION CARD ── */
  .q-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 18px;
    padding: 1.75rem;
    box-shadow: var(--shadow);
  }

  .q-num {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .q-text {
    font-size: 15.5px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.65;
    margin-bottom: 1.25rem;
  }

  .q-img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 0 auto 1.5rem auto;
    border-radius: 8px;
    border: 1px solid var(--border);
    box-shadow: 0 2px 8px rgba(26,58,92,0.05);
    background: #fff;
    opacity: 0.9; 
    transition: opacity 0.2s ease;
  }
  
  .q-card.revealed .q-img {
    opacity: 1;
  }

  .options { display: flex; flex-direction: column; gap: 8px; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 11px 15px;
    border: 1.5px solid var(--border);
    border-radius: 11px;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, transform 0.1s;
    user-select: none;
  }
  .opt:hover:not(.locked) { background: #F0EDE8; transform: translateX(3px); }
  .opt.selected { border-color: var(--selected); background: var(--selected-bg); }
  .opt.selected .circle { background: var(--selected); border-color: var(--selected); color: #fff; }
  .opt.correct { border-color: var(--correct); background: var(--correct-bg); }
  .opt.correct .circle { background: var(--correct); border-color: var(--correct); color: #fff; }
  .opt.wrong { border-color: var(--wrong); background: var(--wrong-bg); }
  .opt.wrong .circle { background: var(--wrong); border-color: var(--wrong); color: #fff; }
  .opt.locked { cursor: default; }

  .circle {
    width: 22px; height: 22px; min-width: 22px;
    border-radius: 50%;
    border: 1.5px solid #C8C0B5;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    color: var(--muted);
    margin-top: 1px;
    font-weight: 700;
    transition: background 0.15s, border-color 0.15s;
  }
  .opt-label {
    font-size: 14px;
    color: var(--text);
    line-height: 1.5;
    padding-top: 1px;
  }

  /* ── NAV ── */
  .nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-top: 1.5rem;
  }
  .nav-right { display: flex; gap: 10px; margin-left: auto; }

  button {
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 10px 22px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--card);
    color: var(--text);
    transition: background 0.12s, transform 0.1s;
  }
  button:hover { background: #F0EDE8; transform: translateY(-1px); }
  button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  button.primary:hover { background: #0F2540; }
  button.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.accent:hover { background: #B5521A; }
  button:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

  /* ── RESULTS ── */
  .result-hero {
    background: var(--primary);
    border-radius: 20px;
    padding: 2.5rem 2rem;
    text-align: center;
    margin-bottom: 1.5rem;
    color: #fff;
    position: relative;
    overflow: hidden;
  }
  .result-hero::before {
    content: '';
    position: absolute; top: -30px; right: -30px;
    width: 150px; height: 150px;
    border-radius: 50%; background: rgba(255,255,255,0.05);
  }
  .score-big {
    font-family: 'DM Serif Display', serif;
    font-size: 64px; line-height: 1; color: #fff;
  }
  .score-pct { font-size: 18px; opacity: 0.75; margin-top: 6px; }
  .score-label {
    font-size: 12px; opacity: 0.6; margin-top: 4px;
    letter-spacing: 0.06em; text-transform: uppercase; font-weight: 500;
  }

  .result-stats { display: flex; gap: 10px; margin-bottom: 1.5rem; }
  .stat-box {
    flex: 1; background: var(--card);
    border: 1.5px solid var(--border); border-radius: 12px;
    padding: 14px; text-align: center; box-shadow: var(--shadow);
  }
  .stat-num { font-family: 'DM Serif Display', serif; font-size: 28px; }
  .stat-num.ok { color: var(--correct); }
  .stat-num.bad { color: var(--wrong); }
  .stat-label { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .result-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 2rem; }

  .result-section-title {
    font-family: 'DM Serif Display', serif;
    font-size: 20px; color: var(--primary);
    margin-bottom: 1rem; padding-top: 0.5rem;
  }

  .tag {
    display: inline-block; font-size: 11px; font-weight: 600;
    padding: 2px 8px; border-radius: 20px; margin-left: 8px;
  }
  .tag.ok { background: var(--correct-bg); color: var(--correct); }
  .tag.bad { background: var(--wrong-bg); color: var(--wrong); }

  .retake-banner {
    background: linear-gradient(135deg, #1B6E4F, #2A9D72);
    border-radius: 16px; padding: 1.5rem; text-align: center;
    color: #fff; margin-bottom: 1.75rem;
  }
  .retake-banner h2 {
    font-family: 'DM Serif Display', serif; font-size: 22px; margin-bottom: 4px;
  }
  .retake-banner p { font-size: 14px; opacity: 0.85; }

  .review-q { margin-bottom: 1rem; }
  .review-q .q-card { animation: none; }

  @media (max-width: 520px) {
    .score-big { font-size: 48px; }
    .result-stats { flex-direction: column; }
    .page { padding: 1.5rem 1rem 3rem; }
    .boxes-grid { flex-direction: column; align-items: center; }
  }
</style>
</head>

// ── Trenutno stanje aplikacije ──
let S = {
  screen: 'landing',  
  activeGroupKey: 'uml', 
  questions: [],
  current: 0,
  answers: {},        
  confirmed: {},      
  wrongIds: [],
  isRetake: false,
};

function arrEq(a, b) {
  return a.length === b.length && a.every(v => b.includes(v)) && b.every(v => a.includes(v));
}

// ── Render sistem ──
function render() {
  const root = document.getElementById('root');
  if (S.screen === 'landing') { renderLanding(root); return; }
  if (S.screen === 'quiz')    { renderQuiz(root);    return; }
  if (S.screen === 'results') { renderResults(root); return; }
}

// ── LANDING PAGE RENDER (Sa dva kvadratića) ──
function renderLanding(root) {
  root.innerHTML = `
    <div class="page">
      <div class="landing-container">
        <h1 class="landing-title">Priprema Ispita</h1>
        <p class="landing-subtitle">Odaberi test koji želiš </p>
        
        <div class="boxes-grid">
          <div class="start-box" onclick="selectQuizGroup('uml')">
            <div class="icon-wrap">📊</div>
            <h3>II Parcijalni</h3>
            <p>${examGroups.uml.length} ispitnih pitanja</p>
          </div>
          
          <div class="start-box" onclick="selectQuizGroup('parcijalni2')">
            <div class="icon-wrap">💾</div>
            <h3>Integralni</h3>
            <p>${examGroups.parcijalni2.length} ispitnih pitanja</p>
          </div>
        </div>

      </div>
    </div>`;
}

function selectQuizGroup(groupKey) {
  S.activeGroupKey = groupKey;
  startQuiz(false);
}

function startQuiz(retake) {
  S.screen = 'quiz';
  const fullGroup = examGroups[S.activeGroupKey];
  
  S.questions = retake
    ? fullGroup.filter(q => S.wrongIds.includes(q.id))
    : [...fullGroup];
    
  S.current = 0;
  S.answers = {};
  S.confirmed = {};
  S.isRetake = retake;
  render();
}

// ── QUIZ STRANICA ──
function renderQuiz(root) {
  const qs = S.questions;
  const qi = S.current;
  const q = qs[qi];
  const sel = S.answers[q.id] || [];
  const locked = !!S.confirmed[q.id];
  const pct = Math.round(((qi) / qs.length) * 100);
  const isLast = qi === qs.length - 1;

  let optsHtml = '';
  q.options.forEach((opt, oi) => {
    const isSel = sel.includes(oi);
    const isCorr = q.correct.includes(oi);
    let cls = 'opt';
    if (locked) {
      cls += ' locked';
      if (isCorr) cls += ' correct';
      else if (isSel && !isCorr) cls += ' wrong';
    } else {
      if (isSel) cls += ' selected';
    }
    const icon = locked
      ? (isCorr ? '✓' : (isSel ? '✗' : ''))
      : (isSel ? '✓' : '');
    const clickFn = locked ? '' : `onclick="toggle(${q.id}, ${oi})"`;
    optsHtml += `<div class="${cls}" ${clickFn}>
      <div class="circle">${icon}</div>
      <span class="opt-label">${opt}</span>
    </div>`;
  });

  let navHtml = `<div class="nav">`;
  if (qi > 0) {
    navHtml += `<button onclick="goTo(${qi - 1})">← Nazad</button>`;
  } else {
    navHtml += `<button onclick="goBackToLanding()">🏠 Početna</button>`;
  }
  navHtml += `<div class="nav-right">`;
  if (!locked) {
    navHtml += `<button class="primary" onclick="confirm(${q.id})" ${sel.length === 0 ? 'disabled' : ''}>Potvrdi odgovor</button>`;
  } else if (isLast) {
    navHtml += `<button class="primary" onclick="finishQuiz()">Završi test →</button>`;
  } else {
    navHtml += `<button class="primary" onclick="goTo(${qi + 1})">Sljedeće →</button>`;
  }
  navHtml += `</div></div>`;

  const imgHtml = q.image ? `<img src="${q.image}" alt="Ispitni zadatak" class="q-img" onerror="this.style.display='none';">` : '';

  const badgeTitle = S.activeGroupKey === 'uml' ? 'II Parcijalni' : 'Integralni';

  root.innerHTML = `
    <div class="page">
      <div class="quiz-header">
        <span class="q-counter">Pitanje ${qi + 1} / ${qs.length}</span>
        <span class="mode-badge ${S.isRetake ? 'retake' : ''}">${S.isRetake ? 'Ponavljanje' : badgeTitle}</span>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-track">
          <div class="progress-fill" style="width:${pct}%"></div>
        </div>
      </div>
      <div class="q-card ${sel.length > 0 || locked ? 'revealed' : ''}">
        <div class="q-num">Pitanje ${qi + 1} od ${qs.length}</div>
        <div class="q-text">${q.text}</div>
        ${imgHtml}
        <div class="options">${optsHtml}</div>
      </div>
      ${navHtml}
    </div>`;
}

function toggle(qid, oi) {
  if (S.confirmed[qid]) return;
  if (!S.answers[qid]) S.answers[qid] = [];
  const idx = S.answers[qid].indexOf(oi);
  if (idx > -1) S.answers[qid].splice(idx, 1);
  else S.answers[qid].push(oi);
  render();
}

function confirm(qid) {
  if ((S.answers[qid] || []).length === 0) return;
  S.confirmed[qid] = true;
  render();
}

function goTo(idx) {
  S.current = idx;
  render();
}

function finishQuiz() {
  S.screen = 'results';
  render();
}

function goBackToLanding() {
  S.screen = 'landing';
  render();
}

// ── REZULTATI ISPITA ──
function renderResults(root) {
  const qs = S.questions;
  const wrongIds = [];
  let correct = 0;
  qs.forEach(q => {
    const sel = S.answers[q.id] || [];
    if (arrEq(sel, q.correct)) correct++;
    else wrongIds.push(q.id);
  });
  S.wrongIds = wrongIds;

  const pct = Math.round((correct / qs.length) * 100);
  const label = pct >= 70 ? 'Odlično urađeno!' : pct >= 50 ? 'Položen ispit' : 'Potrebno dodatno obnavljanje';

  let html = `<div class="page">`;

  if (S.isRetake && wrongIds.length === 0) {
    html += `<div class="retake-banner">
      <h2>Sve tačno! 🎉</h2>
      <p>Uspješno i bez greške su savladana sva ranije netačna pitanja.</p>
    </div>`;
  } else {
    html += `<div class="result-hero">
      <div class="score-big">${correct}/${qs.length}</div>
      <div class="score-pct">${pct}% tačnosti</div>
      <div class="score-label">${label}</div>
    </div>
    <div class="result-stats">
      <div class="stat-box"><div class="stat-num ok">${correct}</div><div class="stat-label">Tačno</div></div>
      <div class="stat-box"><div class="stat-num bad">${qs.length - correct}</div><div class="stat-label">Netačno</div></div>
      <div class="stat-box"><div class="stat-num">${qs.length}</div><div class="stat-label">Ukupno</div></div>
    </div>`;
  }

  html += `<div class="result-actions">`;
  if (wrongIds.length > 0) {
    html += `<button class="accent" onclick="startQuiz(true)">↻ Ponovi samo netačna (${wrongIds.length})</button>`;
  }
  html += `<button class="primary" onclick="restartWholeQuiz()">↻ Pokreni cijeli modul</button>`;
  html += `<button onclick="goBackToLanding()">🏠 Nazad na početnu</button></div>`;

  html += `<div class="result-section-title">Detaljan pregled odgovora</div>`;

  qs.forEach((q, qi) => {
    const sel = S.answers[q.id] || [];
    const isOk = arrEq(sel, q.correct);
    const imgHtml = q.image ? `<img src="${q.image}" alt="Ispitni zadatak" class="q-img" onerror="this.style.display='none';">` : '';

    html += `<div class="review-q"><div class="q-card revealed">
      <div class="q-num">Pitanje ${qi + 1} <span class="tag ${isOk ? 'ok' : 'bad'}">${isOk ? '✓ Tačno' : '✗ Netačno'}</span></div>
      <div class="q-text">${q.text}</div>
      ${imgHtml}
      <div class="options">`;
    q.options.forEach((opt, oi) => {
      const isSel = sel.includes(oi);
      const isCorr = q.correct.includes(oi);
      let cls = 'opt locked';
      if (isCorr) cls += ' correct';
      else if (isSel && !isCorr) cls += ' wrong';
      html += `<div class="${cls}">
        <div class="circle">${isCorr ? '✓' : (isSel ? '✗' : '')}</div>
        <span class="opt-label">${opt}</span>
      </div>`;
    });
    html += `</div></div></div>`;
  });

  html += `<div class="result-actions" style="margin-top:1rem">`;
  if (wrongIds.length > 0) {
    html += `<button class="accent" onclick="startQuiz(true)">↻ Ponovi samo netačna (${wrongIds.length})</button>`;
  }
  html += `<button class="primary" onclick="restartWholeQuiz()">↻ Pokreni iznova</button>`;
  html += `<button onclick="goBackToLanding()">🏠 Početni ekran</button></div>`;
  html += `</div>`;

  root.innerHTML = html;
}

function restartWholeQuiz() {
  startQuiz(false);
}

// Inicijalno pokretanje aplikacije
render();
</script>
</body>
</html>
